<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐺 狼人杀发牌系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c0e2b 0%, #1a1a3e 40%, #0d1b2a 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 头部 */
        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 10px;
        }

        .header h1 {
            font-size: 42px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 6px;
            margin-bottom: 8px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255,107,107,0.5)); }
            50% { filter: drop-shadow(0 0 25px rgba(255,107,107,0.8)); }
        }

        .header p {
            color: #8899aa;
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 设置面板 */
        .setup-panel {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            transition: all 0.5s ease;
        }

        .setup-panel.collapsed {
            padding: 15px 30px;
        }

        .setup-panel.collapsed .setup-content {
            display: none;
        }

        .panel-title {
            font-size: 20px;
            color: #ffd93d;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title .icon {
            font-size: 24px;
        }

        /* 玩家数量设置 */
        .player-count {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .player-count label {
            font-size: 16px;
            color: #ccc;
            white-space: nowrap;
        }

        .count-btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .count-btn {
            width: 42px;
            height: 42px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .count-btn:hover {
            border-color: #ffd93d;
            background: rgba(255,217,61,0.1);
        }

        .count-btn.active {
            border-color: #ffd93d;
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            color: #1a1a2e;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255,217,61,0.4);
        }

        /* 角色配置 */
        .role-config {
            margin-bottom: 25px;
        }

        .role-config-title {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .role-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s;
        }

        .role-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .role-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-emoji {
            font-size: 26px;
            width: 36px;
            text-align: center;
        }

        .role-name {
            font-size: 15px;
            font-weight: 600;
        }

        .role-desc {
            font-size: 11px;
            color: #8899aa;
            margin-top: 2px;
        }

        .role-counter {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter-btn {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .counter-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .counter-btn.minus:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .counter-btn.plus:hover {
            border-color: #51cf66;
            color: #51cf66;
        }

        .counter-value {
            min-width: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 4px 20px rgba(238,90,36,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(238,90,36,0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66, #2b8a3e);
            color: #fff;
            box-shadow: 0 4px 20px rgba(43,138,62,0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(43,138,62,0.6);
        }

        /* 信息提示 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item .label {
            color: #8899aa;
        }

        .info-item .value {
            color: #ffd93d;
            font-weight: bold;
        }

        .info-item .value.error {
            color: #ff6b6b;
        }

        .info-item .value.success {
            color: #51cf66;
        }

        /* 发牌区域 */
        .deal-area {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .deal-area.active {
            display: block;
        }

        .deck-info {
            margin-bottom: 30px;
        }

        .deck-info h2 {
            font-size: 24px;
            color: #ffd93d;
            margin-bottom: 10px;
        }

        .deck-cards {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .deck-card-mini {
            width: 50px;
            height: 70px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #8899aa;
            background: linear-gradient(145deg, #2a2a5e, #1e1e3f);
            border: 2px solid rgba(255,255,255,0.15);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* 卡片背面纹理 */
        .deck-card-mini::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 6px,
                rgba(255,255,255,0.03) 6px,
                rgba(255,255,255,0.03) 12px
            );
        }

        .deck-card-mini::after {
            content: '🂠';
            position: absolute;
            font-size: 24px;
            opacity: 0.3;
        }

        .deck-card-mini .card-number {
            position: relative;
            z-index: 1;
            font-size: 11px;
            color: #556677;
            top: -18px;
            left: -14px;
        }

        .deck-card-mini.dealt {
            opacity: 0.2;
            transform: scale(0.82);
            filter: grayscale(0.5);
        }

        .deck-card-mini.current {
            transform: scale(1.15);
            border-color: #ffd93d;
            box-shadow: 0 0 18px rgba(255,217,61,0.5);
        }

        .deck-card-mini.current::after {
            opacity: 0.6;
        }

        /* 发牌动画区域 */
        .deal-animation-area {
            position: relative;
            height: 320px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-stack {
            position: relative;
            width: 180px;
            height: 260px;
        }

        .stack-card {
            position: absolute;
            width: 180px;
            height: 260px;
            border-radius: 16px;
            background: linear-gradient(145deg, #2a2a5e, #1e1e3f);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: all 0.5s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .stack-card::before {
            content: '🐺';
            position: absolute;
            font-size: 50px;
            opacity: 0.3;
        }

        .stack-card:nth-child(1) { transform: translate(-8px, -6px) rotate(-3deg); }
        .stack-card:nth-child(2) { transform: translate(-4px, -3px) rotate(-1deg); }
        .stack-card:nth-child(3) { transform: translate(0, 0) rotate(1deg); }
        .stack-card:nth-child(4) { transform: translate(4px, 3px) rotate(2deg); }
        .stack-card:nth-child(5) { transform: translate(8px, 6px) rotate(4deg); }

        .flying-card {
            position: fixed;
            width: 180px;
            height: 260px;
            border-radius: 16px;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transition: none;
        }

        /* 当前玩家提示 */
        .current-player-prompt {
            background: rgba(255,217,61,0.08);
            border: 1px solid rgba(255,217,61,0.3);
            border-radius: 16px;
            padding: 20px 30px;
            margin: 20px auto;
            max-width: 500px;
        }

        .current-player-prompt .prompt-text {
            font-size: 18px;
            color: #ffd93d;
            margin-bottom: 8px;
        }

        .current-player-prompt .prompt-hint {
            font-size: 13px;
            color: #8899aa;
        }

        /* 玩家卡片区域 */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .player-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            transition: all 0.4s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--role-color, #666), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-card.revealed::before {
            opacity: 1;
        }

        .player-card.revealed {
            background: rgba(255,255,255,0.08);
            border-color: var(--role-color, #666);
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
        }

        .player-number {
            font-size: 13px;
            color: #8899aa;
            margin-bottom: 8px;
        }

        .player-role-emoji {
            font-size: 42px;
            margin: 10px 0;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .player-card.revealed .player-role-emoji {
            opacity: 1;
            transform: scale(1);
        }

        .player-role-name {
            font-size: 16px;
            font-weight: bold;
            color: #ccc;
            margin-bottom: 4px;
            opacity: 0;
            transition: opacity 0.5s 0.2s;
        }

        .player-card.revealed .player-role-name {
            opacity: 1;
            color: var(--role-color, #fff);
        }

        .player-role-team {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            opacity: 0;
            transition: opacity 0.5s 0.3s;
        }

        .player-card.revealed .player-role-team {
            opacity: 1;
        }

        .player-role-team.good {
            background: rgba(81,207,102,0.15);
            color: #51cf66;
            border: 1px solid rgba(81,207,102,0.3);
        }

        .player-role-team.evil {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.3);
        }

        .player-role-team.neutral {
            background: rgba(255,217,61,0.15);
            color: #ffd93d;
            border: 1px solid rgba(255,217,61,0.3);
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            background: linear-gradient(145deg, #1e1e4a, #151535);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card .role-emoji-large {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal-card .role-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-card .role-team-badge {
            font-size: 14px;
            padding: 5px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .modal-card .role-description {
            font-size: 14px;
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .modal-card .close-hint {
            font-size: 13px;
            color: #666;
        }

        /* 结果显示 */
        .result-panel {
            display: none;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
            margin-top: 25px;
        }

        .result-panel.active {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-panel h2 {
            font-size: 22px;
            color: #ffd93d;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .stat-emoji {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: #8899aa;
        }

        .stat-card .stat-count {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        /* 控制栏 */
        .control-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15,15,40,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            z-index: 100;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-bar.active {
            display: flex;
            animation: slideUpBar 0.3s ease;
        }

        @keyframes slideUpBar {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #51cf66, #2b8a3e);
        }

        /* 预设方案 */
        .preset-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .preset-bar label {
            font-size: 14px;
            color: #8899aa;
            white-space: nowrap;
        }

        .preset-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: #ccc;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            border-color: #ffd93d;
            color: #ffd93d;
            background: rgba(255,217,61,0.08);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .container {
                padding: 10px;
            }

            .setup-panel {
                padding: 20px 15px;
            }

            .role-grid {
                grid-template-columns: 1fr;
            }

            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }

            .player-card {
                padding: 15px 10px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }

            .deal-animation-area {
                height: 250px;
            }

            .card-stack, .stack-card {
                width: 140px;
                height: 200px;
            }
        }

        /* 牌堆洗牌动画 */
        @keyframes shuffle {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-15px) rotate(-5deg); }
            50% { transform: translateX(15px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-3deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        .shuffling {
            animation: shuffle 0.4s ease;
        }

        /* 发牌成功动画 */
        @keyframes dealSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .deal-success {
            animation: dealSuccess 0.3s ease;
        }
    </style>
</head>
<body>

<!-- 星空背景 -->
<div class="stars" id="stars"></div>

<!-- 提示消息 -->
<div class="toast" id="toast"></div>

<!-- 头部 -->
<div class="header">
    <h1>🐺 狼人杀发牌系统</h1>
    <p>配置角色 · 随机发牌 · 公平公正</p>
</div>

<div class="container">
    <!-- 设置面板 -->
    <div class="setup-panel" id="setupPanel">
        <div class="panel-title">
            <span class="icon">⚙️</span>
            <span>游戏配置</span>
        </div>

                <div class="stack-card"></div>
                <div class="stack-card"></div>
                <div class="stack-card"></div>
                <div class="stack-card"></div>

        <!-- 当前玩家提示 -->
        <div class="current-player-prompt" id="playerPrompt" style="display:none;">
            <div class="prompt-text" id="promptText">📱 玩家 1 请查看你的身份</div>
            <div class="prompt-hint">点击下方按钮查看身份（看完后请遮挡屏幕传递给下一位玩家）</div>
            <button class="btn btn-success" style="margin-top: 15px;" onclick="revealCurrentPlayer()">
                👁️ 查看我的身份
            </button>

    <!-- 结果面板 -->
    <div class="result-panel" id="resultPanel">
        <h2>🏆 游戏配置总览</h2>

                <span>🔄</span> 重新开始
            </button>
            <button class="btn btn-secondary" onclick="toggleRoleVisibility()">
                <span>👁️</span> 隐藏/显示所有身份
            </button>
        </div>

        <!-- 玩家卡片 -->
        <div class="players-grid" id="playersGrid"></div>
    </div>
</div>

<!-- 底部控制栏 -->
<div class="control-bar" id="controlBar">
    <button class="btn btn-secondary" onclick="prevPlayer()">
        ◀ 上一位
    </button>
    <span style="color:#8899aa; align-self:center;" id="controlBarInfo">玩家 0/0</span>
    <button class="btn btn-success" onclick="nextPlayer()">
        下一位 ▶
    </button>
    <button class="btn btn-primary" onclick="finishDeal()">
        ✅ 完成发牌
    </button>
</div>

<!-- 身份查看模态框 -->
<div class="modal-overlay" id="roleModal">
    <div class="modal-card" id="modalCard">
        <div class="role-emoji-large" id="modalEmoji">🐺</div>
        <div class="role-title" id="modalTitle">狼人</div>
        <div class="role-team-badge" id="modalTeam">狼人阵营</div>
        <div class="role-description" id="modalDesc">每晚可以杀害一名玩家</div>
        <div class="close-hint">📱 点击任意位置关闭，请记住你的身份！</div>
    </div>
</div>

<script>
// ========== 角色定义 ==========
const ROLES = {
    werewolf: {
        id: 'werewolf',
        name: '狼人',
        emoji: '🐺',
        team: 'evil',
        teamLabel: '狼人阵营',
        color: '#ff6b6b',
        desc: '每晚可以杀害一名玩家，白天混入好人阵营混淆视听。'
    },
    alpha_wolf: {
        id: 'alpha_wolf',
        name: '狼王',
        emoji: '🐺👑',
        team: 'evil',
        teamLabel: '狼人阵营',
        color: '#ff4757',
        desc: '狼人领袖，死亡时可以带走一名玩家（发动技能）。'
    },
    white_wolf: {
        id: 'white_wolf',
        name: '白狼王',
        emoji: '🐺⚡',
        team: 'evil',
        teamLabel: '狼人阵营',
        color: '#ff6348',
        desc: '可以白天自爆并带走一名玩家，触发狼人胜利条件。'
    },
    witch: {
        id: 'witch',
        name: '女巫',
        emoji: '🧙‍♀️',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#a29bfe',
        desc: '拥有一瓶解药和一瓶毒药，每瓶各只能用一次。'
    },
    seer: {
        id: 'seer',
        name: '预言家',
        emoji: '🔮',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#74b9ff',
        desc: '每晚可以查验一名玩家的身份（好人/狼人）。'
    },
    hunter: {
        id: 'hunter',
        name: '猎人',
        emoji: '🏹',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#55efc4',
        desc: '死亡时可以开枪带走一名玩家（被毒杀时不能开枪）。'
    },
    guard: {
        id: 'guard',
        name: '守卫',
        emoji: '🛡️',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#00b894',
        desc: '每晚可以守护一名玩家使其免于被狼人杀害。'
    },
    idiot: {
        id: 'idiot',
        name: '白痴',
        emoji: '🤪',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#ffeaa7',
        desc: '被投票出局时不会死亡，而是翻牌免疫，但失去投票权。'
    },
    knight: {
        id: 'knight',
        name: '骑士',
        emoji: '⚔️',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#fdcb6e',
        desc: '白天可以决斗一名玩家，若对方是狼人则狼人出局，否则自己出局。'
    },
    civilian: {
        id: 'civilian',
        name: '平民',
        emoji: '👨‍🌾',
        team: 'good',
        teamLabel: '好人阵营',
        color: '#b2bec3',
        desc: '没有特殊技能，通过投票和推理找出狼人。'
    },
    godfather: {
        id: 'godfather',
        name: '狼人长老',
        emoji: '🐺🎩',
        team: 'evil',
        teamLabel: '狼人阵营',
        color: '#d63031',
        desc: '狼人首领，可以抵消毒药效果一次。'
    },
    cupid: {
        id: 'cupid',
        name: '丘比特',
        emoji: '💘',
        team: 'neutral',
        teamLabel: '第三方/特殊',
        color: '#e84393',
        desc: '首夜将两名玩家设为情侣，一方死亡另一方也殉情。'
    }
};

// 角色显示顺序
const ROLE_ORDER = [
    'werewolf', 'alpha_wolf', 'white_wolf', 'godfather',
    'witch', 'seer', 'hunter', 'guard', 'idiot', 'knight',
    'cupid', 'civilian'
];

// ========== 状态管理 ==========
let state = {
    playerCount: 9,
    roleCounts: {},
    deck: [],
    currentPlayerIndex: 0,
    revealedPlayers: new Set(),
    isDealing: false,
    dealComplete: false,
    rolesHidden: false
};

// 初始化
function init() {
    generateStars();
    initRoleCounts();
    renderCountButtons();
    renderRoleGrid();
    updateInfo();
}

// 生成星空
function generateStars() {
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
        starsContainer.appendChild(star);
    }
}

// 初始化角色数量
function initRoleCounts() {
    state.roleCounts = {
        werewolf: 2,
        witch: 1,
        seer: 1,
        hunter: 1,
        guard: 1,
        idiot: 0,
        knight: 0,
        alpha_wolf: 0,
        white_wolf: 0,
        godfather: 0,
        cupid: 0,
        civilian: 3
    };
}

// 渲染玩家数量按钮
function renderCountButtons() {
    const container = document.getElementById('countBtnGroup');
    container.innerHTML = '';
    for (let i = 4; i <= 18; i++) {
        const btn = document.createElement('button');
        btn.className = 'count-btn' + (i === state.playerCount ? ' active' : '');
        btn.textContent = i;
        btn.onclick = () => setPlayerCount(i);
        container.appendChild(btn);
    }
}

// 设置玩家数量
function setPlayerCount(count) {
    state.playerCount = count;
    renderCountButtons();
    // 自动调整平民数量使总数匹配
    adjustCivilians();
    updateInfo();
}

// 调整平民数量
function adjustCivilians() {
    const total = Object.entries(state.roleCounts)
        .filter(([k]) => k !== 'civilian')
        .reduce((sum, [, v]) => sum + v, 0);
    const needed = state.playerCount - total;
    if (needed >= 0) {
        state.roleCounts['civilian'] = needed;
    } else {
        // 如果非平民角色超过玩家数，减少狼人
        state.roleCounts['civilian'] = 0;
        let excess = -needed;
        if (state.roleCounts['werewolf'] > excess) {
            state.roleCounts['werewolf'] -= excess;
        } else {
            state.roleCounts['werewolf'] = 0;
        }
    }
    renderRoleGrid();
}

// 渲染角色配置网格
function renderRoleGrid() {
    const container = document.getElementById('roleGrid');
    container.innerHTML = '';

    ROLE_ORDER.forEach(roleId => {
        const role = ROLES[roleId];
        const count = state.roleCounts[roleId] || 0;

        const item = document.createElement('div');
        item.className = 'role-item';
        item.innerHTML = `
            <div class="role-info">
                <div class="role-emoji">${role.emoji}</div>
                <div>
                    <div class="role-name">${role.name}</div>
                    <div class="role-desc">${role.teamLabel}</div>
                </div>
            </div>
            <div class="role-counter">
                <button class="counter-btn minus" onclick="changeRoleCount('${roleId}', -1)">−</button>
                <span class="counter-value">${count}</span>
                <button class="counter-btn plus" onclick="changeRoleCount('${roleId}', 1)">+</button>
            </div>
        `;
        container.appendChild(item);
    });
}

// 修改角色数量
function changeRoleCount(roleId, delta) {
    const newCount = Math.max(0, (state.roleCounts[roleId] || 0) + delta);
    state.roleCounts[roleId] = newCount;
    renderRoleGrid();
    adjustCivilians();
    updateInfo();
}

// 更新信息栏
function updateInfo() {
    const totalRoles = Object.values(state.roleCounts).reduce((a, b) => a + b, 0);
    const totalPlayers = state.playerCount;

    document.getElementById('totalRoles').textContent = totalRoles;
    document.getElementById('totalPlayers').textContent = totalPlayers;

    const statusEl = document.getElementById('configStatus');
    if (totalRoles === totalPlayers && totalRoles > 0) {
        statusEl.textContent = '✅ 配置正确，可以开始！';
        statusEl.className = 'value success';
    } else if (totalRoles < totalPlayers) {
        statusEl.textContent = `⚠️ 还差 ${totalPlayers - totalRoles} 个角色`;
        statusEl.className = 'value error';
    } else {
        statusEl.textContent = `⚠️ 多了 ${totalRoles - totalPlayers} 个角色`;
        statusEl.className = 'value error';
    }
}

// 预设方案
function loadPreset(preset) {
    const presets = {
        beginner: { count: 6, roles: { werewolf: 2, seer: 1, witch: 1, civilian: 2 } },
        standard: { count: 9, roles: { werewolf: 2, witch: 1, seer: 1, hunter: 1, guard: 1, idiot: 1, civilian: 2 } },
        advanced: { count: 12, roles: { werewolf: 3, witch: 1, seer: 1, hunter: 1, guard: 1, idiot: 1, knight: 1, civilian: 3 } },
        expert: { count: 15, roles: { werewolf: 3, alpha_wolf: 1, witch: 1, seer: 1, hunter: 1, guard: 1, idiot: 1, knight: 1, cupid: 1, civilian: 4 } }
    };

    const p = presets[preset];
    if (!p) return;

    state.playerCount = p.count;
    initRoleCounts();
    // 重置后设置预设值
    Object.keys(state.roleCounts).forEach(k => state.roleCounts[k] = 0);
    Object.entries(p.roles).forEach(([k, v]) => {
        if (k in state.roleCounts) state.roleCounts[k] = v;
    });
    // 补充平民
    const total = Object.values(state.roleCounts).reduce((a, b) => a + b, 0);
    if (total < p.count) state.roleCounts['civilian'] = p.count - total;

    renderCountButtons();
    renderRoleGrid();
    updateInfo();
    showToast('方案已加载！', 'success');
}

// 随机配置
function randomizeRoles() {
    const count = state.playerCount;
    Object.keys(state.roleCounts).forEach(k => state.roleCounts[k] = 0);

    // 随机狼人数 (1~Math.ceil(count/3))
    const wolfCount = Math.max(1, Math.min(Math.ceil(count / 3), 4));
    state.roleCounts['werewolf'] = wolfCount;

    // 随机神职数量
    const godRoles = ['witch', 'seer', 'hunter', 'guard', 'idiot', 'knight'];
    const godCount = Math.min(Math.max(2, Math.floor(count / 3)), 5);
    const shuffledGods = [...godRoles].sort(() => Math.random() - 0.5);
    let assigned = wolfCount;
    for (let i = 0; i < godCount && i < shuffledGods.length; i++) {
        state.roleCounts[shuffledGods[i]] = 1;
        assigned++;
    }

    // 剩余全给平民
    state.roleCounts['civilian'] = Math.max(0, count - assigned);

    renderRoleGrid();
    updateInfo();
    showToast('已随机生成角色配置！', 'success');
}

// 重置
function resetAll() {
    state.playerCount = 9;
    initRoleCounts();
    renderCountButtons();
    renderRoleGrid();
    updateInfo();
    showToast('已重置配置');
}

// Toast提示
function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    setTimeout(() => {
        toast.className = 'toast ' + type;
    }, 2500);
}

// ========== 发牌逻辑 ==========

function startDeal() {
    const totalRoles = Object.values(state.roleCounts).reduce((a, b) => a + b, 0);

    if (totalRoles !== state.playerCount) {
        showToast('角色总数必须等于玩家数量！', '');
        return;
    }

    if (state.playerCount < 4) {
        showToast('至少需要4名玩家！', '');
        return;
    }

    // 构建牌堆
    state.deck = [];
    Object.entries(state.roleCounts).forEach(([roleId, count]) => {
        for (let i = 0; i < count; i++) {
            state.deck.push(roleId);
        }
    });

    // 洗牌
    shuffleDeck();

    // 重置状态
    state.currentPlayerIndex = 0;
    state.revealedPlayers = new Set();
    state.dealComplete = false;
    state.rolesHidden = false;

    // 切换界面
    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('dealArea').classList.add('active');
    document.getElementById('resultPanel').classList.remove('active');
    document.getElementById('controlBar').classList.add('active');

    // 渲染牌堆
    renderDeckCards();

    // 更新提示
    updatePlayerPrompt();

    showToast('发牌开始！请将设备传递给玩家查看身份', 'success');
}

// 洗牌（Fisher-Yates）
function shuffleDeck() {
    const stack = document.getElementById('cardStack');
    stack.classList.add('shuffling');
    setTimeout(() => stack.classList.remove('shuffling'), 400);

    for (let i = state.deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
    }
}

// 渲染牌堆卡片（背面朝上，只显示编号）
function renderDeckCards() {
    const container = document.getElementById('deckCards');
    container.innerHTML = '';

    state.deck.forEach((roleId, index) => {
        const card = document.createElement('div');
        card.className = 'deck-card-mini';
        card.id = 'deckCard_' + index;
        // 只放编号，不暴露任何角色信息
        card.innerHTML = `<span class="card-number">${index + 1}</span>`;
        container.appendChild(card);
    });
}

// 更新玩家提示
function updatePlayerPrompt() {
    const idx = state.currentPlayerIndex;
    const total = state.playerCount;
    const isRevealed = state.revealedPlayers.has(idx);

    const prompt = document.getElementById('playerPrompt');
    const promptText = document.getElementById('promptText');
    const btn = prompt.querySelector('.btn');

    document.getElementById('controlBarInfo').textContent = `玩家 ${idx + 1}/${total}`;

    if (idx >= total) {
        prompt.style.display = 'none';
        return;
    }

    prompt.style.display = 'block';

    if (isRevealed) {
        promptText.textContent = `✅ 玩家 ${idx + 1} 已查看身份`;
        btn.style.display = 'none';
    } else {
        promptText.textContent = `📱 玩家 ${idx + 1} 请查看你的身份`;
        btn.style.display = 'inline-flex';
        btn.textContent = '👁️ 查看我的身份';
    }

    // 更新牌堆高亮
    document.querySelectorAll('.deck-card-mini').forEach((el, i) => {
        el.classList.remove('current');
        if (i === idx) el.classList.add('current');
    });
}

// 揭示当前玩家身份
function revealCurrentPlayer() {
    const idx = state.currentPlayerIndex;
    const roleId = state.deck[idx];
    const role = ROLES[roleId];

    // 标记已揭示
    state.revealedPlayers.add(idx);

    // 牌堆卡片标记为已发
    const deckCard = document.getElementById('deckCard_' + idx);
    if (deckCard) deckCard.classList.add('dealt');

    // 显示模态框
    showRoleModal(role);

    // 更新提示
    setTimeout(() => updatePlayerPrompt(), 100);
}

// 显示角色模态框
function showRoleModal(role) {
    const modal = document.getElementById('roleModal');
    const card = document.getElementById('modalCard');

    document.getElementById('modalEmoji').textContent = role.emoji;
    document.getElementById('modalTitle').textContent = role.name;
    document.getElementById('modalDesc').textContent = role.desc;

    const teamBadge = document.getElementById('modalTeam');
    teamBadge.textContent = role.teamLabel;
    teamBadge.className = 'role-team-badge ' + role.team;
    teamBadge.style.background = role.color + '20';
    teamBadge.style.color = role.color;
    teamBadge.style.border = `1px solid ${role.color}50`;

    card.style.borderColor = role.color;
    card.style.boxShadow = `0 0 40px ${role.color}30`;

    modal.classList.add('active');
}

// 关闭模态框
function closeModal() {
    document.getElementById('roleModal').classList.remove('active');
}

// 点击模态框关闭
document.getElementById('roleModal').addEventListener('click', closeModal);

// 上一位玩家
function prevPlayer() {
    if (state.currentPlayerIndex > 0) {
        state.currentPlayerIndex--;
        updatePlayerPrompt();
    }
}

// 下一位玩家
function nextPlayer() {
    if (state.currentPlayerIndex < state.playerCount - 1) {
        state.currentPlayerIndex++;
        updatePlayerPrompt();
    } else {
        // 已在最后一位
        const unrevealed = [];
        for (let i = 0; i < state.playerCount; i++) {
            if (!state.revealedPlayers.has(i)) unrevealed.push(i + 1);
        }
        if (unrevealed.length > 0) {
            showToast(`还有玩家 ${unrealed.join(', ')} 未查看身份`);
        } else {
            finishDeal();
        }
    }
}

// 完成发牌
function finishDeal() {
    state.dealComplete = true;

    // 隐藏发牌区域
    document.getElementById('dealArea').classList.remove('active');
    document.getElementById('controlBar').classList.remove('active');

    // 显示结果面板
    renderResultPanel();
    document.getElementById('resultPanel').classList.add('active');

    showToast('🎉 发牌完成！游戏开始！', 'success');
}

// 渲染结果面板
function renderResultPanel() {
    // 统计
    const stats = { good: 0, evil: 0, neutral: 0 };
    state.deck.forEach(roleId => {
        const team = ROLES[roleId].team;
        stats[team]++;
    });

    const statsContainer = document.getElementById('resultStats');
    statsContainer.innerHTML = `
        <div class="stat-card">
            <div class="stat-emoji">😇</div>
            <div class="stat-label">好人阵营</div>
            <div class="stat-count" style="color:#51cf66">${stats.good}</div>
        </div>
        <div class="stat-card">
            <div class="stat-emoji">😈</div>
            <div class="stat-label">狼人阵营</div>
            <div class="stat-count" style="color:#ff6b6b">${stats.evil}</div>
        </div>
        <div class="stat-card">
            <div class="stat-emoji">🌀</div>
            <div class="stat-label">特殊/中立</div>
            <div class="stat-count" style="color:#ffd93d">${stats.neutral}</div>
        </div>
        <div class="stat-card">
            <div class="stat-emoji">👥</div>
            <div class="stat-label">总玩家</div>
            <div class="stat-count">${state.playerCount}</div>
        </div>
    `;

    // 玩家卡片
    const grid = document.getElementById('playersGrid');
    grid.innerHTML = '';

    state.deck.forEach((roleId, index) => {
        const role = ROLES[roleId];
        const card = document.createElement('div');
        card.className = 'player-card revealed';
        card.id = 'resultCard_' + index;
        card.style.setProperty('--role-color', role.color);
        card.innerHTML = `
            <div class="player-number">玩家 ${index + 1}</div>
            <div class="player-role-emoji">${role.emoji}</div>
            <div class="player-role-name">${role.name}</div>
            <div class="player-role-team ${role.team}">${role.teamLabel}</div>
        `;

        // 默认隐藏身份
        if (state.rolesHidden) {
            card.classList.remove('revealed');
        }

        grid.appendChild(card);
    });
}

// 切换身份显示
function toggleRoleVisibility() {
    state.rolesHidden = !state.rolesHidden;
    const cards = document.querySelectorAll('.player-card');
    cards.forEach(card => {
        if (state.rolesHidden) {
            card.classList.remove('revealed');
        } else {
            card.classList.add('revealed');
        }
    });
    showToast(state.rolesHidden ? '已隐藏所有身份' : '已显示所有身份');
}

// 重新开始
function restartGame() {
    // 重置UI
    document.getElementById('setupPanel').style.display = 'block';
    document.getElementById('dealArea').classList.remove('active');
    document.getElementById('resultPanel').classList.remove('active');
    document.getElementById('controlBar').classList.remove('active');

    // 重置状态
    state.currentPlayerIndex = 0;
    state.revealedPlayers = new Set();
    state.dealComplete = false;
    state.rolesHidden = false;

    showToast('已返回配置界面');
}

// 键盘快捷键
document.addEventListener('keydown', (e) => {
    if (!document.getElementById('dealArea').classList.contains('active')) return;

    switch(e.key) {
        case 'ArrowLeft': prevPlayer(); break;
        case 'ArrowRight': nextPlayer(); break;
        case ' ':
        case 'Enter':
            e.preventDefault();
            if (!state.revealedPlayers.has(state.currentPlayerIndex)) {
                revealCurrentPlayer();
            }
            break;
        case 'Escape': closeModal(); break;
    }
});

// 初始化
init();
</script>

</body>
</html>
